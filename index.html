<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบวัดไฟฟ้าออนไลน์</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #1e293b;
}

.header {
  background: linear-gradient(135deg, #111827, #2563eb);
  color: white;
  text-align: center;
  padding: 30px 15px;
}

.header h1 {
  margin: 0;
  font-size: 30px;
}

.online {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 20px;
  border-radius: 30px;
  background: #16a34a;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.icon {
  font-size: 40px;
}

.name {
  font-size: 17px;
  color: #64748b;
  margin-top: 10px;
}

.value {
  font-size: 30px;
  font-weight: bold;
  margin-top: 8px;
}

.unit {
  font-size: 16px;
  color: #64748b;
}

.chart {
  margin-top: 25px;
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

canvas {
  width: 100%;
  height: 300px;
}

.footer {
  text-align: center;
  padding: 25px;
  color: #64748b;
}

@media(max-width:600px) {
  .header h1 {
    font-size: 24px;
  }

  .value {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="header">

<h1>⚡ ระบบวัดไฟฟ้าออนไลน์</h1>

<p>ESP32 + PZEM-004T</p>

<div class="online">
🟢 ONLINE
</div>

</div>


<div class="container">

<div class="grid">

<div class="card">
<div class="icon">⚡</div>
<div class="name">แรงดันไฟฟ้า</div>
<div class="value">
<span id="voltage">0</span>
<span class="unit">V</span>
</div>
</div>


<div class="card">
<div class="icon">🔌</div>
<div class="name">กระแสไฟฟ้า</div>
<div class="value">
<span id="current">0</span>
<span class="unit">A</span>
</div>
</div>


<div class="card">
<div class="icon">💡</div>
<div class="name">กำลังไฟฟ้า</div>
<div class="value">
<span id="power">0</span>
<span class="unit">W</span>
</div>
</div>


<div class="card">
<div class="icon">📊</div>
<div class="name">พลังงานสะสม</div>
<div class="value">
<span id="energy">0</span>
<span class="unit">kWh</span>
</div>
</div>


<div class="card">
<div class="icon">💰</div>
<div class="name">ค่าไฟต่อชั่วโมง</div>
<div class="value">
<span id="cost">0</span>
<span class="unit">บาท/ชม.</span>
</div>
</div>


<div class="card">
<div class="icon">💵</div>
<div class="name">ค่าไฟสะสม</div>
<div class="value">
<span id="totalCost">0</span>
<span class="unit">บาท</span>
</div>
</div>

</div>


<div class="chart">

<h2>📈 กราฟกำลังไฟฟ้า</h2>

<canvas id="powerChart"></canvas>

</div>

</div>


<div class="footer">

ESP32 Electricity Monitoring System<br>
ข้อมูลจาก ThingSpeak

</div>


<script>

const channelID = "3499357";

const url =
"https://api.thingspeak.com/channels/" +
channelID +
"/feeds.json?results=20";


async function loadData() {

  try {

    const response = await fetch(url);

    const data = await response.json();

    const feeds = data.feeds;

    if (feeds.length == 0) {
      return;
    }

    const last = feeds[feeds.length - 1];


    document.getElementById("voltage").innerText =
      Number(last.field1 || 0).toFixed(1);


    document.getElementById("current").innerText =
      Number(last.field2 || 0).toFixed(2);


    document.getElementById("power").innerText =
      Number(last.field3 || 0).toFixed(1);


    document.getElementById("energy").innerText =
      Number(last.field4 || 0).toFixed(2);


    document.getElementById("cost").innerText =
      Number(last.field5 || 0).toFixed(2);


    document.getElementById("totalCost").innerText =
      Number(last.field6 || 0).toFixed(2);


    drawChart(feeds);

  } catch (error) {

    console.log("ไม่สามารถเชื่อมต่อ ThingSpeak");

  }

}


function drawChart(feeds) {

  const canvas = document.getElementById("powerChart");

  const ctx = canvas.getContext("2d");

  canvas.width = canvas.offsetWidth;
  canvas.height = 300;

  ctx.clearRect(0, 0, canvas.width, canvas.height);


  const powers = feeds.map(function(feed) {

    return Number(feed.field3 || 0);

  });


  let maxPower = Math.max(...powers);

  if (maxPower < 10) {
    maxPower = 10;
  }


  ctx.beginPath();

  ctx.moveTo(0, 280);

  powers.forEach(function(power, index) {

    const x =
      index * (canvas.width / (powers.length - 1));

    const y =
      280 - (power / maxPower * 240);

    if (index == 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

  });


  ctx.strokeStyle = "#2563eb";

  ctx.lineWidth = 4;

  ctx.stroke();


  ctx.font = "14px Arial";

  ctx.fillStyle = "#64748b";

  ctx.fillText(
    "กำลังไฟฟ้า (W)",
    10,
    20
  );

}


loadData();


setInterval(function() {

  loadData();

}, 16000);

</script>

</body>
</html>
