<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ระบบวัดไฟฟ้า</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #1e293b;
}

.header {
    background: linear-gradient(135deg, #111827, #2563eb);
    color: white;
    text-align: center;
    padding: 30px 15px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.status {
    display: inline-block;
    margin-top: 15px;
    padding: 8px 20px;
    border-radius: 30px;
    background: #16a34a;
    font-weight: bold;
}

.warning {
    background: #dc2626;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

.grid {
    display: grid;
    grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));

    gap: 20px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    text-align: center;

    box-shadow:
    0 5px 20px rgba(0,0,0,0.08);
}

.icon {
    font-size: 40px;
}

.name {
    font-size: 17px;
    color: #64748b;
    margin-top: 10px;
}

.value {
    font-size: 30px;
    font-weight: bold;
    margin-top: 8px;
}

.unit {
    font-size: 17px;
    color: #64748b;
}

.footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

</style>

</head>

<body>

<div class="header">

<h1>⚡ ระบบวัดไฟฟ้า ESP32</h1>

<p>PZEM-004T Electricity Monitoring</p>

<div id="status" class="status">
🟢 ONLINE
</div>

</div>


<div class="container">

<div class="grid">


<div class="card">

<div class="icon">⚡</div>

<div class="name">
แรงดันไฟฟ้า
</div>

<div class="value">

<span id="voltage">0</span>

<span class="unit">V</span>

</div>

</div>


<div class="card">

<div class="icon">🔌</div>

<div class="name">
กระแสไฟฟ้า
</div>

<div class="value">

<span id="current">0</span>

<span class="unit">A</span>

</div>

</div>


<div class="card">

<div class="icon">💡</div>

<div class="name">
กำลังไฟฟ้า
</div>

<div class="value">

<span id="power">0</span>

<span class="unit">W</span>

</div>

</div>


<div class="card">

<div class="icon">📊</div>

<div class="name">
พลังงานสะสม
</div>

<div class="value">

<span id="energy">0</span>

<span class="unit">kWh</span>

</div>

</div>


<div class="card">

<div class="icon">💰</div>

<div class="name">
ค่าไฟต่อชั่วโมง
</div>

<div class="value">

<span id="cost">0</span>

<span class="unit">
บาท/ชม.
</span>

</div>

</div>


<div class="card">

<div class="icon">💵</div>

<div class="name">
ค่าไฟสะสม
</div>

<div class="value">

<span id="totalCost">0</span>

<span class="unit">
บาท
</span>

</div>

</div>


</div>

</div>


<div class="footer">

ESP32 + PZEM-004T + Firebase

</div>


<!-- Firebase -->

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// Firebase Configuration

const firebaseConfig = {

    apiKey:
    "AIzaSyAD1PRsE7T90otvZoKrwENdPmbgrJG-RKE",

    authDomain:
    "electric-monitor-648d7.firebaseapp.com",

    databaseURL:
    "https://electric-monitor-648d7-default-rtdb.firebaseio.com",

    projectId:
    "electric-monitor-648d7",

    storageBucket:
    "electric-monitor-648d7.firebasestorage.app",

    messagingSenderId:
    "72175707129",

    appId:
    "1:72175707129:web:2250a63bf56a1f1c09d328",

    measurementId:
    "G-304FBDBJY5"
};


// เริ่ม Firebase

const app = initializeApp(firebaseConfig);

const database = getDatabase(app);


// ตำแหน่งข้อมูล

const electricityRef =
ref(database, "electricity");


// รับข้อมูลจาก Firebase

onValue(electricityRef, (snapshot) => {

    const data = snapshot.val();


    if (!data) {
        return;
    }


    // แสดงข้อมูล

    document.getElementById("voltage")
    .innerText =
    Number(data.voltage || 0)
    .toFixed(1);


    document.getElementById("current")
    .innerText =
    Number(data.current || 0)
    .toFixed(2);


    document.getElementById("power")
    .innerText =
    Number(data.power || 0)
    .toFixed(1);


    document.getElementById("energy")
    .innerText =
    Number(data.energy || 0)
    .toFixed(2);


    document.getElementById("cost")
    .innerText =
    Number(data.costPerHour || 0)
    .toFixed(2);


    document.getElementById("totalCost")
    .innerText =
    Number(data.totalCost || 0)
    .toFixed(2);


    // สถานะ

    const status =
    document.getElementById("status");


    if (data.warning == true) {

        status.innerText =
        "🔴 CURRENT OVER 20A";

        status.className =
        "status warning";

    }

    else {

        status.innerText =
        "🟢 ONLINE";

        status.className =
        "status";
    }

});

</script>

</body>

</html>
